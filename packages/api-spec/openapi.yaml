          maxLength: 500

    Idea:
      type: object
      required: [id, content, user, submittedAt]
      properties:
        id:
          type: integer
        content:
          type: string
          description: 최대 500자
        user:
          $ref: '#/components/schemas/InquiryUser'
        submittedAt:
          type: string
          format: date-time

    IdeaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Idea'

    InquiryImageOriginalUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: 원본 이미지를 내려받을 임시 주소입니다.

    InquiryImageNotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
