openapi: 3.0.3
info:
  title: 댕v2 백오피스 API
  version: 0.1.0
  description: |
    BO 1단계(KD3-578) API 명세 초안. 범위는 로그인·세션, 내 계정, 팀원 계정, 1:1 문의, 아이디어 제안이다.
    공지, 약관, 변경 이력, 알림은 아직 쓰지 않았다.

    공통 규약은 docs/api-conventions.md를 따른다: 성공 응답은 감싸지 않고, 에러는 `{ code, message, details? }`,
    목록은 `page`(1부터)·`size`, 시각은 ISO 8601 UTC, 필드는 camelCase, 값이 없으면 `null`.
    응답 형식(래핑 여부, 에러 모양, 페이지 필드)은 PR #2 논의 결과에 따라 `components.schemas`의 `Error`,
    `PageMeta`만 고치면 된다.

    `[확인 필요]`로 표시한 부분은 서버 담당자 확인이 필요한 항목이다.
servers:
  - url: /api/v0/admin
    description:
      BO 서버의 기본 주소. 현재 웹이 쓰는 `/api/v0/platform-admin`에서 바꾼다. BO(admin 도메인)와 서비스(app 도메인)의
      도메인이 달라 기존 앱 API와 주소가 겹치지 않는다.
tags:
  - name: Auth
    description: 로그인 세션
  - name: Me
    description: 내 계정
  - name: TeamMembers
    description: 팀원 계정 관리 (최고 관리자)
  - name: Inquiries
    description: 1:1 문의 (최고 관리자·운영자)
  - name: Ideas
    description: 아이디어 제안 (조회 전용)
security:
  - sessionCookie: []
paths:
  /auth/google:
    post:
      tags: [Auth]
      operationId: loginWithGoogle
      summary: 구글 로그인
      description: |
        프론트가 Sign In With Google 버튼으로 받은 ID 토큰을 보내면, 서버가 구글 공개키로 검증하고 팀원 계정을 확인한 뒤
        세션을 만든다(FR-BO-010, 011, 014). 세션 ID는 HttpOnly 쿠키로 내려간다. 계정을 자동으로 만들지 않는다.
        등록한 이메일과 구글이 검증한 이메일은 대소문자 구분 없이 비교한다.

        첫 로그인이면 등록됨이 활성으로 바뀌고 응답의 `isProfileCompleted`가 `false`다. 프론트는 프로필 설정 화면으로 보낸다.
        로그인 성공·실패는 접속 기록에 남는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: 로그인됨. 로그인한 팀원의 내 계정을 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccount'
        '401':
          description: ID 토큰을 검증하지 못했다(`INVALID_ID_TOKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            로그인을 거절한다(`LOGIN_NOT_ALLOWED`). BO 팀원으로 등록되지 않은 구글 계정이거나, 비활성화·등록 취소된 계정이다.
            프론트는 "접근 권한 없음"을 안내한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃
      description: 프로필 패널의 로그아웃(FR-BO-013). 세션을 종료한다.
      responses:
        '204':
          description: 로그아웃됨
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [Me]
      operationId: getMyAccount
      summary: 내 계정 조회
      description: |
        로그인한 팀원의 정보를 반환한다. 모든 역할이 쓸 수 있다.
        첫 로그인 전에는 `displayName`, `jobRole`이 `null`이고 `isProfileCompleted`가 `false`다(FR-BO-033).
      responses:
        '200':
          description: 내 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Me]
      operationId: updateMyAccount
      summary: 표시명·직무 저장
      description: |
        첫 로그인 프로필 설정과 프로필 패널이 함께 쓴다(FR-BO-030~033).
        표시명은 1~10자이고 다른 팀원과 중복될 수 없다. 중복은 저장 시점에 서버가 검사한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyAccountRequest'
      responses:
        '200':
          description: 저장된 내 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccount'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 표시명이 이미 사용 중이다(`PROFILE_DISPLAY_NAME_DUPLICATE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /team-members:
    get:
      tags: [TeamMembers]
      operationId: listTeamMembers
      summary: 팀원 계정 목록
      description: |
        최고 관리자만 쓸 수 있다(FR-BO-020). PRD가 20건씩 페이지 이동을 정한 목록은 문의·제안·공지·변경 이력이고 팀원 목록은
        아니다. 팀원은 많지 않아서 페이지 없이 전체를 배열로 반환한다(규약의 목록 page/size 방식의 예외).
      responses:
        '200':
          description: 팀원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [TeamMembers]
      operationId: registerTeamMember
      summary: 팀원 등록
      description: |
        구글 이메일과 역할로 등록한다(FR-BO-021). 표시명·직무는 입력하지 않고, 등록된 계정이 처음 로그인하면 활성이 된다.
        이메일은 전 상태에서 유일하다. 비활성·등록 취소 계정의 이메일은 재활성화로만 되돌릴 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTeamMemberRequest'
      responses:
        '201':
          description: 등록된 팀원(상태 `registered`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            이미 등록된 이메일이다. 등록됨·활성이면 `TEAM_MEMBER_EMAIL_DUPLICATE`, 비활성·등록 취소이면
            `TEAM_MEMBER_EMAIL_INACTIVE`(재활성화 안내). [확인 필요] 코드 이름은 제안이다(현재 웹 mock은 모두 `TEAM_MEMBER_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /team-members/{email}:
    patch:
      tags: [TeamMembers]
      operationId: changeTeamMemberRole
      summary: 역할 변경
      description: |
        활성 또는 등록됨 계정의 역할을 바꾼다(FR-BO-022). 다음 요청부터 바로 적용한다. 계정은 삭제하지 않는다.

        마지막 최고 관리자와 본인 계정은 역할을 바꿀 수 없다(FR-BO-024). '마지막 최고 관리자'는 활성 상태의 최고 관리자 중
        마지막 1명이며 등록됨은 수에 포함하지 않는다. 동시 요청에서도 서버가 이 규칙을 보장한다.
      parameters:
        - $ref: '#/components/parameters/TeamMemberEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTeamMemberRoleRequest'
      responses:
        '200':
          description: 변경된 팀원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamMemberNotFound'
        '409':
          $ref: '#/components/responses/TeamMemberConflict'

  /team-members/{email}/deactivate:
    post:
      tags: [TeamMembers]
      operationId: deactivateTeamMember
      summary: 비활성화
      description: |
        활성 계정을 비활성으로 바꾼다(FR-BO-023). 로그인할 수 없게 되고 진행 중인 세션은 즉시 종료한다(FR-BO-014).
        마지막 최고 관리자와 본인 계정은 비활성화할 수 없다(FR-BO-024). 활성이 아닌 계정은 거부한다.
      parameters:
        - $ref: '#/components/parameters/TeamMemberEmail'
      responses:
        '200':
          description: 비활성화된 팀원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamMemberNotFound'
        '409':
          $ref: '#/components/responses/TeamMemberConflict'

  /team-members/{email}/cancel:
    post:
      tags: [TeamMembers]
      operationId: cancelTeamMemberRegistration
      summary: 등록 취소
      description: |
        아직 로그인하지 않은 등록됨 계정의 등록을 취소한다(FR-BO-023). 로그인할 수 없게 된다. 등록됨이 아닌 계정은 거부한다.
      parameters:
        - $ref: '#/components/parameters/TeamMemberEmail'
      responses:
        '200':
          description: 등록 취소된 팀원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamMemberNotFound'
        '409':
          $ref: '#/components/responses/TeamMemberConflict'

  /team-members/{email}/reactivate:
    post:
      tags: [TeamMembers]
      operationId: reactivateTeamMember
      summary: 재활성화
      description: |
        비활성 또는 등록 취소 계정을 되돌린다(FR-BO-023). 로그인한 적이 없으면 등록됨, 있으면 활성이 된다.
        비활성·등록 취소가 아닌 계정은 거부한다.
      parameters:
        - $ref: '#/components/parameters/TeamMemberEmail'
      responses:
        '200':
          description: 재활성화된 팀원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamMemberNotFound'
        '409':
          $ref: '#/components/responses/TeamMemberConflict'

  /inquiries:
    get:
      tags: [Inquiries]
      operationId: listInquiries
      summary: 문의 목록
      description: |
        최고 관리자·운영자만 쓸 수 있다. 검색은 부분 일치·대소문자 무시이고 대상은 제목, 사용자 이름·이메일, 문의 ID, 대화 내용
        전체다(FR-BO-050). 정렬은 최근 활동순이고 동률은 문의 ID 내림차순이다. 최근 활동은 마지막 메시지의 작성 시각이며
        맡기·담당 변경·담당 해제·상태 변경은 갱신하지 않는다.
        "전체"는 파라미터를 보내지 않는 것으로 표현한다.
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          description: 문의 상태. 생략하면 전체
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: userType
          in: query
          description: 사용자 유형. 생략하면 전체
          schema:
            $ref: '#/components/schemas/UserType'
        - name: assignee
          in: query
          description: |
            담당자. `me`(내 담당), `unassigned`(미배정), 또는 팀원 이메일. 생략하면 전체
          schema:
            type: string
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 문의 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquirySummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inquiries/assignees:
    get:
      tags: [Inquiries]
      operationId: listInquiryAssignees
      summary: 담당자 필터 후보
      description: |
        담당자 필터에 쓸 팀원 목록. 표시명이 없는 등록됨·등록 취소 팀원은 빠진다. 비활성 팀원은 담당자로 남아 있을 수
        있어서 포함한다.
      responses:
        '200':
          description: 담당자 후보
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InquiryAssignee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inquiries/{id}:
    get:
      tags: [Inquiries]
      operationId: getInquiry
      summary: 문의 상세
      description: |
        문의 정보, 담당자, 메시지 스레드(시간순)를 반환한다(FR-BO-052).
        HEIC·HEIF 이미지는 서버가 만든 웹 표시용 변환본을 `url`로 주고 원본은 `originalUrl`로 준다.
        [확인 필요] HEIC·HEIF 서버 변환 여부(PRD 개발 확인 사항). 변환하지 않으면 `originalUrl`은 항상 `null`이다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: 문의 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'

  /inquiries/{id}/adjacent:
    get:
      tags: [Inquiries]
      operationId: getAdjacentInquiries
      summary: 목록 기준 이전·다음 문의
      description: |
        목록과 같은 조건(`keyword`, `status`, `userType`, `assignee`, `sort`)에서 이 문의의 앞뒤 문의 번호를 반환한다.
        지금 조건에 이 문의가 없으면(예: 미배정 필터에서 맡음) 둘 다 `null`이다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: userType
          in: query
          schema:
            $ref: '#/components/schemas/UserType'
        - name: assignee
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 앞뒤 문의 번호
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryAdjacent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'

  /inquiries/{id}/assignee:
    post:
      tags: [Inquiries]
      operationId: assignInquiry
      summary: 내가 맡기
      description: |
        요청한 팀원이 담당자가 된다(FR-BO-053). 담당자를 지정하는 주체는 없고 본인이 맡는 방식이다.
        맡는 시점의 상태가 답변 대기이면 확인 중으로 자동 변경하고, 그 외 상태는 유지한다. 이 상태 변경은 최근 활동을 갱신하지
        않는다. 담당자가 있었다면 이전 담당자에게 BO 알림을 보낸다(FR-BO-060).

        요청에 화면에서 본 담당자(`expectedAssigneeEmail`)를 함께 보낸다. 실제 담당자와 다르면 담당자를 바꾸지 않고 409로
        거부한다(FR-BO-054). 이때 프론트는 문의를 다시 읽어 확인창을 다시 보여 준다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignInquiryRequest'
      responses:
        '200':
          description: 담당자가 바뀐 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'
        '409':
          $ref: '#/components/responses/InquiryConflict'
    delete:
      tags: [Inquiries]
      operationId: releaseInquiryAssignee
      summary: 담당 해제
      description: |
        담당자가 미배정으로 돌아간다(FR-BO-055). 상태는 바뀌지 않는다. 해결 완료 문의는 거부한다.
        요청한 팀원이 현재 담당자가 아니면 해제하지 않고 409(`INQUIRY_ASSIGNEE_CHANGED`)로 거부한다. 화면에서는 담당자에게만 해제
        버튼이 보이지만 서버가 직접 호출도 막는다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: 담당자가 해제된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'
        '409':
          $ref: '#/components/responses/InquiryConflict'

  /inquiries/{id}/assignee/restore:
    post:
      tags: [Inquiries]
      operationId: restoreInquiryAssignee
      summary: 담당 해제 실행 취소
      description: |
        방금 한 담당 해제를 취소해 요청한 팀원이 담당자가 된다(해제한 사람이 담당자였으므로 이전 담당자 복구와 같다). 해결 완료
        문의, 또는 해제 뒤 다른 팀원이 먼저 맡은 문의는 취소하지 않고 409(`INQUIRY_ASSIGNEE_CHANGED`·`INQUIRY_RESOLVED`)로 거부한다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: 담당자가 복구된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'
        '409':
          $ref: '#/components/responses/InquiryConflict'

  /inquiries/{id}/replies:
    post:
      tags: [Inquiries]
      operationId: replyInquiry
      summary: 답변 저장
      description: |
        담당자만 답변할 수 있다(FR-BO-056, 057, 058). 텍스트 1~500자이고 이미지 첨부는 없다. 해결 완료 전이면 연속 답변을
        허용하며, 저장할 때마다 사용자에게 내용 없는 앱 알림이 간다. 저장하면 확인 중·답변 대기는 답변 도착이 되고, 최근
        활동이 답변 시각으로 바뀐다. 저장하는 순간 담당자가 아니면 저장하지 않고 409로 거부한다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyInquiryRequest'
      responses:
        '200':
          description: 답변이 추가된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '400':
          description: 빈 답변이거나 500자를 넘는다(`INQUIRY_REPLY_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'
        '409':
          $ref: '#/components/responses/InquiryConflict'

  /ideas:
    get:
      tags: [Ideas]
      operationId: listIdeas
      summary: 아이디어 제안 목록
      description: |
        모든 역할이 조회할 수 있다(FR-BO-070). 최근 제출순이 기본이다. 검색 대상은 내용과 사용자 계정(이름·이메일)이다.
        처리 상태·담당자·분류는 없다.
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: userType
          in: query
          description: 사용자 유형. 생략하면 전체
          schema:
            $ref: '#/components/schemas/UserType'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 제안 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ideas/{id}:
    get:
      tags: [Ideas]
      operationId: getIdea
      summary: 아이디어 제안 상세
      parameters:
        - name: id
          in: path
          required: true
          description: 제안 ID
          schema:
            type: integer
      responses:
        '200':
          description: 제안 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Idea'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 제안을 찾을 수 없다(`IDEA_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        구글 로그인 후 서버 세션과 HttpOnly 쿠키로 인증한다(ADR 0008). 무활동 24시간 후 만료되고, 계정을 비활성화하면
        세션이 즉시 종료된다.

  parameters:
    Keyword:
      name: keyword
      in: query
      description: 검색어. 부분 일치, 대소문자 무시
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: 정렬. `latest` 최신순(기본), `oldest` 오래된순. 동률은 ID 내림차순
      schema:
        type: string
        enum: [latest, oldest]
        default: latest
    Page:
      name: page
      in: query
      description: 페이지 번호. 1부터 시작
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: 한 페이지 건수. PRD는 20건씩 이동한다
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    InquiryId:
      name: id
      in: path
      required: true
      description: 문의 ID
      schema:
        type: integer

    TeamMemberEmail:
      name: email
      in: path
      required: true
      description: 대상 팀원 이메일(URL 인코딩)
      schema:
        type: string
        format: email

  responses:
    Unauthorized:
      description: |
        로그인 뒤 어느 API에서든 같은 코드로 내려간다. 화면 안내가 달라서 상황마다 코드를 구분한다.

        - `UNAUTHENTICATED`: 세션이 없다(로그인한 적이 없거나 로그아웃했다). 프론트는 안내 없이 로그인 화면으로 보낸다.
        - `SESSION_EXPIRED`: 마지막 요청 뒤 24시간 동안 요청이 없어 서버가 세션을 끝냈다. "로그인이 만료되었습니다"를 안내한다.
        - `ACCOUNT_DEACTIVATED`: 쓰는 도중 관리자가 계정을 비활성화해 서버가 세션을 지웠다. "접근 권한 없음"을 안내한다.

        [확인 필요] 코드 이름은 제안이다. 프론트가 요청한 것은 상황별로 구분되는 코드다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 이 역할에는 허용되지 않는다(`FORBIDDEN`). 권한 없는 접근 시도는 접속 기록에 남는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: 입력값이 올바르지 않다(`VALIDATION_FAILED`). 필드별 사유는 `details`에 있다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TeamMemberNotFound:
      description: 계정을 찾을 수 없다(`TEAM_MEMBER_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TeamMemberConflict:
      description: |
        마지막 최고 관리자·본인 계정 보호(`TEAM_MEMBER_PROTECTED`), 또는 화면을 본 뒤 계정 상태가 바뀌어 이 동작을 할 수 없다
        (`TEAM_MEMBER_STATE_CHANGED`). [확인 필요] 코드 이름은 제안이다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InquiryNotFound:
      description: 문의를 찾을 수 없다(`INQUIRY_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InquiryConflict:
      description: |
        문의 상태 충돌. 화면을 본 뒤 담당자가 바뀌었으면 `INQUIRY_ASSIGNEE_CHANGED`, 해결 완료 문의면
        `INQUIRY_RESOLVED`다. 프론트는 최신 문의를 다시 읽는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: 에러 본문. `details`는 입력 검증 실패에서만 채운다.
      required: [code, message]
      properties:
        code:
          type: string
          description: 대문자 스네이크 케이스(`USER_NOT_FOUND`). 프론트는 `message`가 아니라 `code`로 분기한다.
          example: INQUIRY_NOT_FOUND
        message:
          type: string
          example: 문의를 찾을 수 없습니다.
        details:
          type: array
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
                example: email
              reason:
                type: string
                example: 이메일 형식이 아닙니다.

    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    Role:
      type: string
      description: 역할. 계정당 1개(FR-BO-002). [확인 필요] enum 값 표기는 현재 웹의 camelCase를 따랐다.
      enum: [superAdmin, operator, viewer]

    JobRole:
      type: string
      description: |
        직무. 권한과 무관한 표시용이다(FR-BO-032).
        [확인 필요] 현재 웹(`@daeng/shared`의 `JOB_ROLES`)은 화면 문구(`풀스택`)를 값으로 쓴다. enum 표기를 정할 때 함께 정한다.
      enum: [PM, UX/UI, FE, BE, 풀스택]

    UserType:
      type: string
      description: 사용자 유형. `guardian` 보호자, `director` 원장
      enum: [guardian, director]

    MemberStatus:
      type: string
      description: 팀원 계정 상태. `registered` 등록됨, `active` 활성, `inactive` 비활성, `cancelled` 등록 취소
      enum: [registered, active, inactive, cancelled]

    MyAccount:
      type: object
      required: [email, googleName, suggestedDisplayName, displayName, jobRole, role, isProfileCompleted]
      properties:
        email:
          type: string
          format: email
        googleName:
          type: string
          description: 연결된 구글 계정 이름(읽기 전용)
        suggestedDisplayName:
          type: string
          nullable: true
          description: 첫 로그인 설정의 표시명 초기값. 구글 이름이 1~10자 규칙을 어기거나 이미 사용 중이면 `null`
        displayName:
          type: string
          nullable: true
        jobRole:
          type: string
          allOf:
            - $ref: '#/components/schemas/JobRole'
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        isProfileCompleted:
          type: boolean

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Sign In With Google이 준 ID 토큰(JWT). 서버가 구글 공개키로 검증한다.

    UpdateMyAccountRequest:
      type: object
      required: [displayName, jobRole]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 10
        jobRole:
          $ref: '#/components/schemas/JobRole'

    TeamMember:
      type: object
      required: [email, displayName, jobRole, role, status, lastLoginAt, registeredAt]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
          description: 등록됨 상태에서는 `null`
        jobRole:
          type: string
          allOf:
            - $ref: '#/components/schemas/JobRole'
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MemberStatus'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        registeredAt:
          type: string
          format: date-time

    RegisterTeamMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: 구글 이메일. 대소문자 구분 없이 비교한다(FR-BO-011)
        role:
          $ref: '#/components/schemas/Role'

    ChangeTeamMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    InquiryStatus:
      type: string
      description: |
        BO 문의 상태(PRD 4.1). `waiting` 답변 대기, `checking` 확인 중, `answered` 답변 도착, `resolved` 해결 완료.
        `checking`은 BO 안에서만 쓰며 앱 API에는 `waiting`으로 내려간다.
      enum: [waiting, checking, answered, resolved]

    InquiryAssignee:
      type: object
      description: 문의 담당자. 비활성 팀원도 담당자로 남아 있을 수 있다.
      required: [email, displayName, jobRole, isActive]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        jobRole:
          $ref: '#/components/schemas/JobRole'
        isActive:
          type: boolean

    InquiryUser:
      type: object
      required: [type, name, email]
      properties:
        type:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
        email:
          type: string

    InquiryImage:
      type: object
      required: [id, url, originalUrl, fileName]
      properties:
        id:
          type: string
        url:
          type: string
          description: 웹 표시용 주소. HEIC·HEIF는 서버 변환본(JPG·PNG)
        originalUrl:
          type: string
          nullable: true
          description: 원본 다운로드 주소. 변환하지 않은 이미지는 `null`
        fileName:
          type: string

    InquiryMessage:
      type: object
      required: [id, author, authorName, body, createdAt, images]
      properties:
        id:
          type: string
        author:
          type: string
          description: '`user` 앱 사용자, `operator` 운영자'
          enum: [user, operator]
        authorName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        images:
          type: array
          description: 메시지당 최대 5장
          items:
            $ref: '#/components/schemas/InquiryImage'

    InquirySummary:
      type: object
      description: 문의 목록의 한 행. 접수 시각과 대화는 상세에서만 준다.
      required: [id, status, title, user, assignee, lastActivityAt]
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/InquiryStatus'
        title:
          type: string
          description: 최대 30자
        user:
          $ref: '#/components/schemas/InquiryUser'
        assignee:
          type: object
          allOf:
            - $ref: '#/components/schemas/InquiryAssignee'
          nullable: true
        lastActivityAt:
          type: string
          format: date-time
          description: 마지막 메시지(사용자 문의·추가 문의·운영자 답변)의 작성 시각

    InquiryDetail:
      allOf:
        - $ref: '#/components/schemas/InquirySummary'
        - type: object
          required: [createdAt, messages]
          properties:
            createdAt:
              type: string
              format: date-time
            messages:
              type: array
              description: 시간순
              items:
                $ref: '#/components/schemas/InquiryMessage'

    InquirySummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InquirySummary'

    InquiryAdjacent:
      type: object
      required: [prevId, nextId]
      properties:
        prevId:
          type: integer
          nullable: true
        nextId:
          type: integer
          nullable: true

    AssignInquiryRequest:
      type: object
      required: [expectedAssigneeEmail]
      properties:
        expectedAssigneeEmail:
          type: string
          nullable: true
          description: 화면에서 본 담당자의 이메일. 미배정으로 봤으면 `null`

    ReplyInquiryRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500

    Idea:
      type: object
      required: [id, content, user, submittedAt]
      properties:
        id:
          type: integer
        content:
          type: string
          description: 최대 500자
        user:
          $ref: '#/components/schemas/InquiryUser'
        submittedAt:
          type: string
          format: date-time

    IdeaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Idea'
