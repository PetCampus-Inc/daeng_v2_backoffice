openapi: 3.0.3
info:
  title: daeng_v2_backoffice API
  version: 0.1.0
  description: |
    백오피스 API 문서
servers:
  - url: /api/v0/admin
    description: local
tags:
  - name: '개발용'
    description: 개발 환경에서만 켜지는 기능. 운영에서는 404입니다.
  - name: '인증'
    description: 로그인 세션
  - name: '내 계정'
    description: 내 계정
  - name: '팀원·권한'
    description: 팀원 계정 관리 (최고 관리자)
  - name: '1:1 문의'
    description: 1:1 문의 (최고 관리자·운영자)
  - name: '아이디어 제안'
    description: 아이디어 제안 (조회 전용)
  - name: '변경 이력'
    description: 변경 이력 (최고 관리자)
  - name: '앱 공지'
    description: 앱 공지 (조회는 전 역할, 작성·게시는 최고 관리자·운영자)
  - name: '이용약관'
    description: 이용약관 (조회는 전 역할, 등록·공개·철회는 최고 관리자)
  - name: '알림 센터'
    description: 알림 센터 (내 알림)
  - name: '홈·고객 관리'
    description: 기존 어드민 조회 화면(대시보드·회원·유치원·원장 인증 현황), 서비스 DB 읽기 전용
security:
  - sessionCookie: []

paths:
  /auth/login:
    post:
      tags: ['인증']
      operationId: login
      summary: 로그인
      description: |-
        구글 계정으로 로그인하고 세션을 만듭니다.
        - 등록된 이메일만 로그인할 수 있습니다(대소문자는 구분하지 않습니다). 계정은 자동으로 만들어지지 않습니다.
        - 세션은 HttpOnly 쿠키로 저장됩니다.
        - 첫 로그인이면 `isProfileCompleted`가 `false`입니다.
        - 로그인 성공·실패는 접속 기록에 남습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공. 내 계정을 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccount'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: '인증 실패'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidIdTokenError'
        '403':
          description: |-
            권한 없음. 등록되지 않았거나 비활성·등록 취소된 계정이면 `LOGIN_NOT_ALLOWED`, 허용되지 않은 출처의 요청이면
            `FORBIDDEN`입니다.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginNotAllowedError'
                  - $ref: '#/components/schemas/ForbiddenError'

  /auth/dev-login:
    post:
      tags: ['개발용']
      operationId: devLogin
      summary: 개발용 로그인
      description: |-
        구글 검증 없이 등록된 이메일로 로그인하고 세션을 만듭니다. 로컬 개발과 Swagger 시험용입니다.
        - 개발 환경에서만 켜집니다(`DEV_LOGIN_ENABLED=true`). 꺼져 있으면 운영을 포함해 `404`입니다.
        - 등록되지 않았거나 비활성·등록 취소된 이메일은 `/auth/login`과 똑같이 거부합니다.
        - 세션 쿠키와 응답은 `/auth/login`과 같습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: 로그인 성공. 내 계정을 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccount'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          description: |-
            권한 없음. 등록되지 않았거나 비활성·등록 취소된 계정이면 `LOGIN_NOT_ALLOWED`, 허용되지 않은 출처의 요청이면
            `FORBIDDEN`입니다.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginNotAllowedError'
                  - $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: 개발용 로그인이 꺼진 환경입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: ['인증']
      operationId: logout
      summary: 로그아웃
      description: |-
        로그아웃합니다. 세션이 종료됩니다.
      responses:
        '204':
          description: 로그아웃됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me:
    get:
      tags: ['내 계정']
      operationId: getMyAccount
      summary: 내 계정 조회
      description: |-
        내 계정 정보를 반환합니다. 첫 로그인 전에는 `displayName`, `jobRole`이 `null`입니다.
      responses:
        '200':
          description: 내 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: ['내 계정']
      operationId: updateMyAccount
      summary: 표시명·직무 저장
      description: |-
        표시명과 직무를 저장합니다. 표시명은 1~10자이고, 다른 팀원과 대소문자 구분 없이 겹칠 수 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyAccountRequest'
      responses:
        '200':
          description: 저장된 내 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccount'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '충돌'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDisplayNameDuplicateError'

  /team-members:
    get:
      tags: ['팀원·권한']
      operationId: listTeamMembers
      summary: 팀원 계정 목록
      description: |-
        팀원 전체 목록을 반환합니다. 페이지로 나누지 않습니다.
      responses:
        '200':
          description: 팀원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: ['팀원·권한']
      operationId: registerTeamMember
      summary: 팀원 등록
      description: |-
        구글 이메일과 역할로 팀원을 등록합니다. 이메일은 상태와 관계없이 중복될 수 없습니다. 표시명과 직무는 첫 로그인 때 정합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTeamMemberRequest'
      responses:
        '201':
          description: 등록된 팀원(`REGISTERED` 상태)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |-
            충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberEmailConflictError'

  /team-members/{memberId}:
    patch:
      tags: ['팀원·권한']
      operationId: changeTeamMemberRole
      summary: 역할 변경
      description: |-
        활성·등록됨 계정의 역할을 바꿉니다. 바뀐 역할은 다음 요청부터 바로 적용됩니다.
        마지막 최고 관리자(활성 기준)와 본인 계정은 바꿀 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/TeamMemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTeamMemberRoleRequest'
      responses:
        '200':
          description: 변경된 팀원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamMemberNotFound'
        '409':
          $ref: '#/components/responses/TeamMemberConflict'

  /team-members/{memberId}/deactivate:
    post:
      tags: ['팀원·권한']
      operationId: deactivateTeamMember
      summary: 비활성화
      description: |-
        활성 계정을 비활성화하고, 진행 중인 세션을 종료합니다.
        마지막 최고 관리자와 본인 계정은 비활성화할 수 없습니다. 활성 상태가 아니면 실패합니다.
      parameters:
        - $ref: '#/components/parameters/TeamMemberId'
      responses:
        '200':
          description: 비활성화된 팀원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamMemberNotFound'
        '409':
          $ref: '#/components/responses/TeamMemberConflict'

  /team-members/{memberId}/cancel:
    post:
      tags: ['팀원·권한']
      operationId: cancelTeamMemberRegistration
      summary: 등록 취소
      description: |-
        로그인 전(등록됨) 계정의 등록을 취소합니다. 등록됨 상태가 아니면 실패합니다.
      parameters:
        - $ref: '#/components/parameters/TeamMemberId'
      responses:
        '200':
          description: 등록 취소된 팀원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamMemberNotFound'
        '409':
          $ref: '#/components/responses/TeamMemberConflict'

  /team-members/{memberId}/reactivate:
    post:
      tags: ['팀원·권한']
      operationId: reactivateTeamMember
      summary: 재활성화
      description: |-
        비활성·등록 취소 계정을 다시 사용할 수 있게 합니다. 로그인한 적이 없으면 `REGISTERED`, 있으면 `ACTIVE`가 됩니다.
      parameters:
        - $ref: '#/components/parameters/TeamMemberId'
      responses:
        '200':
          description: 재활성화된 팀원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamMemberNotFound'
        '409':
          $ref: '#/components/responses/TeamMemberConflict'

  /inquiries:
    get:
      tags: ['1:1 문의']
      operationId: listInquiries
      summary: 문의 목록
      description: |-
        문의 목록을 반환합니다.
        - 검색: 제목, 사용자 이름·이메일, 문의 ID, 대화 내용
        - 정렬: 최근 활동순(마지막 메시지 시각), 같으면 ID 내림차순
        - 담당자는 표시명·직무와 활성 여부(`isActive`)를 함께 반환합니다.
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          description: 문의 상태. 생략하면 전체
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: userType
          in: query
          description: 사용자 유형. 생략하면 전체
          schema:
            $ref: '#/components/schemas/UserType'
        - name: assignee
          in: query
          description: |
            담당자. `ME`(내 담당), `UNASSIGNED`(미배정), 또는 팀원 ID. 생략하면 전체
          schema:
            type: string
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 문의 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquirySummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inquiries/assignees:
    get:
      tags: ['1:1 문의']
      operationId: listInquiryAssignees
      summary: 담당자 필터 후보
      description: |-
        담당자 필터에 쓸 팀원 목록을 반환합니다. 표시명이 있는 팀원만 포함하며, 비활성 팀원도 포함합니다.
      responses:
        '200':
          description: 담당자 후보
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InquiryAssignee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inquiries/{id}:
    get:
      tags: ['1:1 문의']
      operationId: getInquiry
      summary: 문의 상세
      description: |-
        문의 정보, 담당자, 메시지(시간순)를 반환합니다.
        HEIC·HEIF 이미지는 변환본(JPG·PNG)이 `url`에 담깁니다. [확인 필요] 서버 변환 여부
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: 문의 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'

  /inquiries/{id}/adjacent:
    get:
      tags: ['1:1 문의']
      operationId: getAdjacentInquiries
      summary: 목록 기준 이전·다음 문의
      description: |-
        같은 검색 조건에서 이전·다음 문의 번호를 반환합니다. 조건에 이 문의가 없으면 둘 다 `null`입니다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: userType
          in: query
          schema:
            $ref: '#/components/schemas/UserType'
        - name: assignee
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 앞뒤 문의 번호
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryAdjacent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'

  /inquiries/{id}/assignee:
    post:
      tags: ['1:1 문의']
      operationId: assignInquiry
      summary: 내가 맡기
      description: |-
        요청한 팀원이 문의를 맡습니다.
        - 답변 대기 상태면 확인 중으로 바뀝니다(최근 활동은 그대로입니다).
        - 이전 담당자에게 알림이 갑니다.
        - `expectedAssigneeId`가 실제 담당자와 다르면 409로 실패합니다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignInquiryRequest'
      responses:
        '200':
          description: 담당자가 바뀐 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'
        '409':
          $ref: '#/components/responses/InquiryConflict'
    delete:
      tags: ['1:1 문의']
      operationId: releaseInquiryAssignee
      summary: 담당 해제
      description: |-
        담당을 해제합니다. 상태는 그대로입니다. 현재 담당자만 할 수 있고, 해결 완료된 문의는 할 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: 담당자가 해제된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'
        '409':
          $ref: '#/components/responses/InquiryConflict'

  /inquiries/{id}/assignee/restore:
    post:
      tags: ['1:1 문의']
      operationId: restoreInquiryAssignee
      summary: 담당 해제 실행 취소
      description: |-
        방금 한 담당 해제를 취소하고, 요청한 팀원을 다시 담당자로 만듭니다.
        해제한 뒤 다른 팀원이 맡았거나 해결 완료된 문의는 취소할 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: 담당자가 복구된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'
        '409':
          $ref: '#/components/responses/InquiryConflict'

  /inquiries/{id}/replies:
    post:
      tags: ['1:1 문의']
      operationId: replyInquiry
      summary: 답변 저장
      description: |-
        담당자만 답변할 수 있습니다. 1~500자이고 이미지는 첨부할 수 없으며, 해결 완료 전에는 연속으로 답변할 수 있습니다.
        저장하면 사용자에게 알림이 가고 상태가 답변 도착으로 바뀝니다. 저장하는 시점에 담당자가 아니면 409로 실패합니다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyInquiryRequest'
      responses:
        '200':
          description: 답변이 추가된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '400':
          description: '잘못된 요청'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryReplyInvalidError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InquiryNotFound'
        '409':
          $ref: '#/components/responses/InquiryConflict'

  /inquiries/{id}/images/{imageId}/original:
    get:
      tags: ['1:1 문의']
      operationId: downloadInquiryImageOriginal
      summary: 문의 이미지 원본 다운로드
      description: |-
        원본 이미지를 내려받을 임시 주소를 알려 줍니다. 역할을 확인한 뒤 응답하며, 받은 주소는 일정 시간만 유효합니다.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
        - name: imageId
          in: path
          required: true
          description: 이미지 ID
          schema:
            type: string
      responses:
        '200':
          description: 원본 이미지의 임시 주소입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryImageOriginalUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |-
            찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryImageNotFoundError'

  /ideas:
    get:
      tags: ['아이디어 제안']
      operationId: listIdeas
      summary: 아이디어 제안 목록
      description: |-
        아이디어 제안 목록을 반환합니다. 최근 제출순이며, 내용과 사용자 이름·이메일로 검색합니다.
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: userType
          in: query
          description: 사용자 유형. 생략하면 전체
          schema:
            $ref: '#/components/schemas/UserType'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 제안 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ideas/{id}:
    get:
      tags: ['아이디어 제안']
      operationId: getIdea
      summary: 아이디어 제안 상세
      parameters:
        - name: id
          in: path
          required: true
          description: 제안 ID
          schema:
            type: integer
      responses:
        '200':
          description: 제안 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Idea'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '찾을 수 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaNotFoundError'
      description: |-
        아이디어 제안 상세를 반환합니다.

  /change-logs:
    get:
      tags: ['변경 이력']
      operationId: listChangeLogs
      summary: 변경 이력 목록
      description: |-
        변경 이력을 최신순으로 반환합니다. 기간은 KST 날짜 기준이며 `to`일도 포함합니다.
        이력은 쓰기 작업이 성공하면 서버가 자동으로 남기고, 접속 기록은 API로 제공하지 않습니다.
      parameters:
        - name: from
          in: query
          description: 시작일(KST, `YYYY-MM-DD`). 생략하면 처음부터
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: 종료일(KST, `YYYY-MM-DD`, 이날 포함). 생략하면 끝까지
          schema:
            type: string
            format: date
        - name: actorId
          in: query
          description: 행위자 팀원 ID. 생략하면 전체
          schema:
            type: integer
        - name: targetType
          in: query
          description: 대상 종류. 생략하면 전체
          schema:
            $ref: '#/components/schemas/ChangeLogTargetType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 변경 이력 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeLogPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notices:
    get:
      tags: ['앱 공지']
      operationId: listNotices
      summary: 앱 공지 목록
      description: |-
        공지 목록을 반환합니다. 제목으로 검색합니다.
        정렬은 고정입니다. 초안(최근 생성순)이 먼저 오고, 그 뒤에 게시·게시 해제 공지(최초 게시일시 내림차순)가 옵니다.
      parameters:
        - name: keyword
          in: query
          description: 제목 검색어
          schema:
            type: string
        - name: status
          in: query
          description: 게시 상태. 생략하면 전체
          schema:
            $ref: '#/components/schemas/NoticeStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 공지 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: ['앱 공지']
      operationId: createNotice
      summary: 공지 초안 저장
      description: |-
        공지 초안을 저장합니다. 제목·본문이 비어 있어도 되고 길이만 검사합니다.
        바로 게시하려면 이어서 `publishNotice`를 호출합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoticeRequest'
      responses:
        '201':
          description: 저장된 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notices/{id}:
    get:
      tags: ['앱 공지']
      operationId: getNotice
      summary: 앱 공지 상세
      description: |-
        공지 상세를 반환합니다.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: 공지 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoticeNotFound'
    patch:
      tags: ['앱 공지']
      operationId: updateNotice
      summary: 공지 저장·수정
      description: |-
        공지를 저장합니다(초안·게시·게시 해제 모두). 보낸 필드만 바뀝니다.
        게시된 적 있는 공지는 제목·본문을 비울 수 없고, 게시일과 정렬 순서는 바뀌지 않습니다.
        `version`이 다르면 409로 실패합니다.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoticeRequest'
      responses:
        '200':
          description: 저장된 공지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '400':
          description: |-
            잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeContentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoticeNotFound'
        '409':
          $ref: '#/components/responses/NoticeVersionConflict'
    delete:
      tags: ['앱 공지']
      operationId: deleteNotice
      summary: 공지 초안 삭제
      description: |-
        공지 초안을 삭제합니다. 초안만 삭제할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoticeNotFound'
        '409':
          description: '충돌'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeNotDraftError'

  /notices/{id}/publication:
    put:
      tags: ['앱 공지']
      operationId: publishNotice
      summary: 공지 게시·재게시
      description: |-
        초안을 게시하거나, 게시 해제된 공지를 다시 게시합니다. 바로 게시되고 푸시는 보내지 않습니다.
        최초 게시일시는 유지됩니다. 제목·본문이 비어 있으면 게시할 수 없습니다. 게시 해제의 '실행 취소'도 이 API로 합니다.
        변경 이력에는 처음 게시가 `NOTICE_CREATED`, 재게시가 `NOTICE_REPUBLISHED`로 남습니다.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeVersionRequest'
      responses:
        '200':
          description: 게시된 공지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '400':
          description: '잘못된 요청'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeContentRequiredError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoticeNotFound'
        '409':
          description: |-
            충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticePublishConflictError'
    delete:
      tags: ['앱 공지']
      operationId: unpublishNotice
      summary: 공지 게시 해제
      description: |-
        공지 게시를 해제합니다. 다시 게시할 수 있습니다. 게시 중이 아니면 실패하며, `version`은 확인하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: 게시 해제된 공지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoticeNotFound'
        '409':
          description: '충돌'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeNotPublishedError'

  /notices/images/upload-urls:
    post:
      tags: ['앱 공지']
      operationId: createNoticeImageUploadUrls
      summary: 공지 이미지 업로드 주소 발급
      description: |-
        공지 본문에 넣을 이미지의 업로드 주소를 발급합니다. `uploadUrl`로 파일을 올린 뒤, `imageUrl`을 본문에 `![설명](imageUrl)` 형태로 넣습니다.
        JPEG·PNG만 가능하고, 파일당 20MB 이하로 한 번에 10개까지 올릴 수 있습니다. [확인 필요] 용량·개수 기준
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeImageUploadRequest'
      responses:
        '200':
          description: 업로드 주소
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoticeImageUploadUrl'
        '400':
          description: '잘못된 요청'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeImageInvalidError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /terms:
    get:
      tags: ['이용약관']
      operationId: listTerms
      summary: 약관 3종 요약
      description: |-
        약관 3종(서비스 이용약관, 개인정보 처리방침, 위치기반서비스 이용약관)을 고정된 순서로 반환합니다. 종류는 `kind`로 구분합니다.
      responses:
        '200':
          description: 약관 3종
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TermsKindSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /terms/{kind}/versions:
    get:
      tags: ['이용약관']
      operationId: listTermsVersions
      summary: 약관별 버전 목록
      description: |-
        약관별 전체 버전을 시행일 내림차순으로 반환합니다. 페이지로 나누지 않습니다.
      parameters:
        - $ref: '#/components/parameters/TermsKind'
      responses:
        '200':
          description: 버전 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TermsVersionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: ['이용약관']
      operationId: createTermsVersion
      summary: 약관 새 버전 초안 저장
      description: |-
        약관 새 버전을 초안으로 저장합니다. 시행일은 공개할 때 검증합니다.
        시작 내용은 `getTermsDraftTemplate`로 받을 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/TermsKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTermsVersionRequest'
      responses:
        '201':
          description: 저장된 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsVersion'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /terms/{kind}/draft-template:
    get:
      tags: ['이용약관']
      operationId: getTermsDraftTemplate
      summary: 새 버전 초안의 시작 내용
      description: |-
        새 버전을 쓸 때 채워 넣을 시작 본문을 반환합니다. 같은 약관에서 시행일이 가장 늦은 공개 버전(예정 포함, 철회 제외)의 본문이며,
        공고일·시행일은 `{{공고일}}`·`{{시행일}}`로 바뀌어 있습니다. 공개된 버전이 없으면 `null`입니다.
      parameters:
        - $ref: '#/components/parameters/TermsKind'
      responses:
        '200':
          description: 시작 내용
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsDraftTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /term-versions/{id}:
    get:
      tags: ['이용약관']
      operationId: getTermsVersion
      summary: 약관 버전 상세
      description: |-
        약관 버전 상세를 반환합니다.
      parameters:
        - $ref: '#/components/parameters/TermsVersionId'
      responses:
        '200':
          description: 버전 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TermsVersionNotFound'
    patch:
      tags: ['이용약관']
      operationId: updateTermsVersion
      summary: 약관 초안 수정
      description: |-
        약관 초안을 수정합니다. 초안만 수정할 수 있고, 보낸 필드만 바뀝니다. `version`이 다르면 409로 실패합니다.
      parameters:
        - $ref: '#/components/parameters/TermsVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTermsVersionRequest'
      responses:
        '200':
          description: 저장된 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsVersion'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TermsVersionNotFound'
        '409':
          $ref: '#/components/responses/TermsVersionConflict'
    delete:
      tags: ['이용약관']
      operationId: deleteTermsVersion
      summary: 약관 초안 삭제
      description: |-
        약관 초안을 삭제합니다. 초안만 삭제할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/TermsVersionId'
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TermsVersionNotFound'
        '409':
          description: '충돌'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsVersionNotDraftError'

  /term-versions/{id}/publication:
    put:
      tags: ['이용약관']
      operationId: publishTermsVersion
      summary: 약관 버전 공개
      description: |-
        약관 버전을 공개합니다.
        시행일은 공개일(KST)로부터 7일 이후여야 하고, 같은 약관의 공개된 버전 중 가장 늦은 시행일보다 뒤여야 합니다.
        공개하면 `{{공고일}}`·`{{시행일}}`이 실제 날짜로 채워지고, 이후에는 수정·삭제할 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/TermsVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsVersionRequest'
      responses:
        '200':
          description: 공개된 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsVersion'
        '400':
          description: |-
            잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsEffectiveDateError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TermsVersionNotFound'
        '409':
          $ref: '#/components/responses/TermsVersionConflict'
    delete:
      tags: ['이용약관']
      operationId: withdrawTermsVersion
      summary: 약관 예정 버전 공개 철회
      description: |-
        시행 전인 예정 버전의 공개를 철회합니다. 철회한 버전은 이력에 남고 앱에서 내려가며, 다시 공개할 수 없습니다.
        시행일이 지났거나 공개 상태가 아니면 철회할 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/TermsVersionId'
      responses:
        '200':
          description: 철회된 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TermsVersionNotFound'
        '409':
          description: '충돌'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsWithdrawNotAllowedError'

  /notifications:
    get:
      tags: ['알림 센터']
      operationId: listNotifications
      summary: 내 알림 목록
      description: |-
        내 알림을 최근순으로 반환합니다. 읽음 여부는 사람마다 따로 관리되고, 알림 문구는 서버가 만듭니다. 디스코드 발송은 API로 제공하지 않습니다.
        [확인 필요] 한 번에 보여 줄 건수 기준이 없어 다른 목록처럼 20건씩 나눕니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/unread-count:
    get:
      tags: ['알림 센터']
      operationId: getUnreadNotificationCount
      summary: 안 읽은 알림 수
      description: |-
        안 읽은 알림 수를 반환합니다.
      responses:
        '200':
          description: 안 읽은 알림 수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNotificationCount'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    post:
      tags: ['알림 센터']
      operationId: readAllNotifications
      summary: 모두 읽음
      description: |-
        내 알림을 모두 읽음 처리합니다.
      responses:
        '204':
          description: 읽음 처리됨
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{id}/read:
    post:
      tags: ['알림 센터']
      operationId: readNotification
      summary: 알림 읽음 처리
      description: |-
        알림 하나를 읽음 처리합니다. 알림이 가리키는 대상을 볼 수 없어도 읽음 처리할 수 있습니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 알림 ID
          schema:
            type: integer
      responses:
        '200':
          description: 읽음 처리된 알림
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '찾을 수 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationNotFoundError'

  /service-admin/overview:
    get:
      tags: ['홈·고객 관리']
      operationId: getServiceOverview
      summary: 서비스 현황 개요(홈 대시보드)
      description: |-
        홈 대시보드 지표를 반환합니다(서비스 DB 읽기 전용). 가입 추이 날짜는 KST 기준입니다.
        - `guardians`: 활성 반려견이 있는 활성 회원
        - `activeOwners`: 해지되지 않은 원장 역할의 활성 회원
        - `managedSchools`: 활성 원장이 연결된 유치원
      parameters:
        - name: days
          in: query
          description: 가입 추이 기간(일). 7~90, 기본 30
          schema:
            type: integer
            minimum: 7
            maximum: 90
            default: 30
      responses:
        '200':
          description: 개요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /service-admin/members:
    get:
      tags: ['홈·고객 관리']
      operationId: listServiceMembers
      summary: 서비스 회원 목록
      description: |-
        서비스 회원 목록을 반환합니다. 최신 가입순이며, 이메일·전화번호는 마스킹됩니다. 아이디, 이름, 이메일, 전화번호로 검색합니다.
      parameters:
        - name: type
          in: query
          description: 회원 구분. 생략하면 전체
          schema:
            $ref: '#/components/schemas/ServiceMemberType'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 회원 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceMemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /service-admin/schools:
    get:
      tags: ['홈·고객 관리']
      operationId: listServiceSchools
      summary: 서비스 유치원 목록
      description: |-
        서비스 유치원 목록을 반환합니다. 최신 등록순이며, 전화번호는 마스킹됩니다. 이름, 주소, 원장 이름으로 검색합니다.
      parameters:
        - name: status
          in: query
          description: 유치원 상태. 생략하면 전체
          schema:
            $ref: '#/components/schemas/SchoolStatus'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 유치원 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSchoolPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /service-admin/verifications:
    get:
      tags: ['홈·고객 관리']
      operationId: listServiceVerifications
      summary: 원장 인증 현황 목록
      description: |-
        원장 인증 현황 목록을 반환합니다. 제출 시각 최신순이며, 전화번호·사업자등록번호는 마스킹됩니다. 유치원 이름, 대표자 이름, 회원 아이디로 검색합니다.
      parameters:
        - name: status
          in: query
          description: 인증 상태. 생략하면 전체
          schema:
            $ref: '#/components/schemas/VerificationStatus'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 인증 현황 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceVerificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description:
        구글 로그인 후 HttpOnly 세션 쿠키로 인증합니다. 24시간 동안 요청이 없으면 만료되고, 계정을 비활성화하면 바로
        종료됩니다.

  parameters:
    Keyword:
      name: keyword
      in: query
      description: 검색어(부분 일치, 대소문자 무시)
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: 정렬. `LATEST` 최신순(기본), `OLDEST` 오래된순. 같으면 ID 내림차순
      schema:
        type: string
        enum: [LATEST, OLDEST]
        default: LATEST
    Page:
      name: page
      in: query
      description: 페이지 번호. 1부터 시작
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: 한 페이지 건수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    InquiryId:
      name: id
      in: path
      required: true
      description: 문의 ID
      schema:
        type: integer

    TeamMemberId:
      name: memberId
      in: path
      required: true
      description: 대상 팀원 ID
      schema:
        type: integer

    NoticeId:
      name: id
      in: path
      required: true
      description: 공지 ID
      schema:
        type: integer

    TermsKind:
      name: kind
      in: path
      required: true
      description: 약관 종류
      schema:
        $ref: '#/components/schemas/TermsKind'

    TermsVersionId:
      name: id
      in: path
      required: true
      description: 약관 버전 ID
      schema:
        type: integer

  responses:
    Unauthorized:
      description: |-
        인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    Forbidden:
      description: '권한 없음'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    ValidationFailed:
      description: '잘못된 요청'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationFailedError'
    TeamMemberNotFound:
      description: '찾을 수 없음'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamMemberNotFoundError'
    TeamMemberConflict:
      description: |-
        충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamMemberConflictError'
    InquiryNotFound:
      description: '찾을 수 없음'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InquiryNotFoundError'
    InquiryConflict:
      description: |-
        충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InquiryConflictError'
    NoticeNotFound:
      description: '찾을 수 없음'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoticeNotFoundError'
    NoticeVersionConflict:
      description: '충돌'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoticeVersionConflictError'
    TermsVersionNotFound:
      description: '찾을 수 없음'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TermsVersionNotFoundError'
    TermsVersionConflict:
      description: |-
        충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TermsVersionConflictError'

  schemas:
    Error:
      type: object
      description: 에러 응답입니다. 입력 검증에 실패했을 때만 `details`가 포함됩니다.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            모든 API에서 공통으로 나올 수 있는 코드는 `BAD_REQUEST`(형식이 잘못된 요청, 너무 큰 요청 포함),
            `NOT_FOUND`(없는 주소), `INTERNAL_ERROR`(서버 오류)입니다.
        message:
          type: string
          description: 사람이 읽는 설명입니다. 문구는 바뀔 수 있습니다.

    ValidationErrorDetail:
      type: object
      description: 필드별 검증 실패 사유
      required: [field, reason]
      properties:
        field:
          type: string
          example: email
        reason:
          type: string
          example: 이메일 형식이 아닙니다.

    InvalidIdTokenError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INVALID_ID_TOKEN]
      example:
        code: INVALID_ID_TOKEN
        message: ID 토큰을 확인할 수 없습니다.

    LoginNotAllowedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [LOGIN_NOT_ALLOWED]
      example:
        code: LOGIN_NOT_ALLOWED
        message: 접근 권한이 없는 계정입니다. 관리자에게 문의해 주세요.

    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED, SESSION_EXPIRED, ACCOUNT_DEACTIVATED]
      example:
        code: UNAUTHENTICATED
        message: 로그인이 필요합니다.

    ForbiddenError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: >-
                `FORBIDDEN` 권한이 없거나 허용되지 않은 요청입니다. `PROFILE_INCOMPLETE` 첫 로그인 프로필(표시명·직무)을
                설정하기 전에는 내 계정과 로그아웃 외의 기능을 쓸 수 없습니다.
              enum: [FORBIDDEN, PROFILE_INCOMPLETE]
      example:
        code: FORBIDDEN
        message: 이 기능을 사용할 권한이 없습니다.

    ValidationFailedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED]
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationErrorDetail'
      example:
        code: VALIDATION_FAILED
        message: 입력값이 올바르지 않습니다.
        details:
          - field: email
            reason: 이메일 형식이 아닙니다.

    ProfileDisplayNameDuplicateError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [PROFILE_DISPLAY_NAME_DUPLICATE]
      example:
        code: PROFILE_DISPLAY_NAME_DUPLICATE
        message: 이미 사용 중인 표시명입니다.

    TeamMemberEmailConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [TEAM_MEMBER_EMAIL_DUPLICATE, TEAM_MEMBER_EMAIL_INACTIVE]
      example:
        code: TEAM_MEMBER_EMAIL_DUPLICATE
        message: 이미 등록된 이메일입니다.

    TeamMemberNotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [TEAM_MEMBER_NOT_FOUND]
      example:
        code: TEAM_MEMBER_NOT_FOUND
        message: 계정을 찾을 수 없습니다.

    TeamMemberConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [TEAM_MEMBER_PROTECTED, TEAM_MEMBER_STATE_CHANGED]
      example:
        code: TEAM_MEMBER_PROTECTED
        message: 마지막 최고 관리자와 본인 계정은 변경할 수 없습니다.

    InquiryNotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INQUIRY_NOT_FOUND]
      example:
        code: INQUIRY_NOT_FOUND
        message: 문의를 찾을 수 없습니다.

    InquiryConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INQUIRY_ASSIGNEE_CHANGED, INQUIRY_RESOLVED]
      example:
        code: INQUIRY_ASSIGNEE_CHANGED
        message: 담당자가 바뀌었습니다. 최신 내용을 확인해 주세요.

    InquiryReplyInvalidError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INQUIRY_REPLY_INVALID]
      example:
        code: INQUIRY_REPLY_INVALID
        message: 답변은 1자 이상 500자 이하로 입력해 주세요.

    IdeaNotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [IDEA_NOT_FOUND]
      example:
        code: IDEA_NOT_FOUND
        message: 제안을 찾을 수 없습니다.

    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    Role:
      type: string
      description: 역할. `SUPER_ADMIN` 최고 관리자, `OPERATOR` 운영자, `VIEWER` 조회자
      enum: [SUPER_ADMIN, OPERATOR, VIEWER]

    JobRole:
      type: string
      description:
        직무입니다. 권한과 무관한 표시용 값이며, 화면에 보이는 이름(`UX/UI`, `풀스택` 등)은 프론트에서 정합니다.
      enum: [PM, UX_UI, FE, BE, FULL_STACK]

    UserType:
      type: string
      description: 사용자 유형. `GUARDIAN` 보호자, `DIRECTOR` 원장
      enum: [GUARDIAN, DIRECTOR]

    MemberStatus:
      type: string
      description: 팀원 계정 상태. `REGISTERED` 등록됨, `ACTIVE` 활성, `INACTIVE` 비활성, `CANCELLED` 등록 취소
      enum: [REGISTERED, ACTIVE, INACTIVE, CANCELLED]

    MyAccount:
      type: object
      required: [id, email, googleName, displayName, jobRole, role, isProfileCompleted]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
          example: petcampus.knockdog@gmail.com
        googleName:
          type: string
          description: 연결된 구글 계정 이름(읽기 전용)입니다. 첫 로그인 설정에서 표시명 초기값으로 씁니다.
        displayName:
          type: string
          nullable: true
        jobRole:
          oneOf:
            - $ref: '#/components/schemas/JobRole'
            - type: string
              nullable: true
              enum: [null]
        role:
          $ref: '#/components/schemas/Role'
        isProfileCompleted:
          type: boolean

    LoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: 구글 ID 토큰(JWT)

    DevLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: 등록된 팀원의 이메일(대소문자 구분 없음)
          example: petcampus.knockdog@gmail.com

    UpdateMyAccountRequest:
      type: object
      required: [displayName, jobRole]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 10
        jobRole:
          $ref: '#/components/schemas/JobRole'

    TeamMember:
      type: object
      required: [id, email, displayName, jobRole, role, status, lastLoginAt, registeredAt]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
          example: petcampus.knockdog@gmail.com
        displayName:
          type: string
          nullable: true
          description: 등록됨 상태에서는 `null`입니다.
        jobRole:
          oneOf:
            - $ref: '#/components/schemas/JobRole'
            - type: string
              nullable: true
              enum: [null]
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MemberStatus'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        registeredAt:
          type: string
          format: date-time

    RegisterTeamMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: 구글 이메일(대소문자 구분 없음)
          example: petcampus.knockdog@gmail.com
        role:
          $ref: '#/components/schemas/Role'

    ChangeTeamMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    InquiryStatus:
      type: string
      description:
        문의 상태. `WAITING` 답변 대기, `CHECKING` 확인 중(BO 전용, 앱에는 `WAITING`), `ANSWERED` 답변 도착, `RESOLVED`
        해결 완료
      enum: [WAITING, CHECKING, ANSWERED, RESOLVED]

    InquiryAssignee:
      type: object
      description: 문의 담당자입니다. 비활성 팀원도 담당자로 남을 수 있습니다.
      required: [id, email, displayName, jobRole, isActive]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
          example: petcampus.knockdog@gmail.com
        displayName:
          type: string
        jobRole:
          $ref: '#/components/schemas/JobRole'
        isActive:
          type: boolean

    InquiryUser:
      type: object
      required: [type, name, email]
      properties:
        type:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
        email:
          type: string
          example: petcampus.knockdog@gmail.com

    InquiryImage:
      type: object
      required: [id, url, fileName]
      properties:
        id:
          type: string
        url:
          type: string
          description: 화면 표시용 주소입니다. HEIC·HEIF는 변환본(JPG·PNG)입니다.
        fileName:
          type: string

    InquiryMessage:
      type: object
      required: [id, author, authorName, body, createdAt, images]
      properties:
        id:
          type: string
        author:
          type: string
          description: '`USER` 앱 사용자, `OPERATOR` 운영자'
          enum: [USER, OPERATOR]
        authorName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        images:
          type: array
          description: 메시지당 최대 5장
          items:
            $ref: '#/components/schemas/InquiryImage'

    InquirySummary:
      type: object
      description: 문의 목록의 한 행입니다. 접수 시각과 대화는 상세에서만 반환합니다.
      required: [id, status, title, user, assignee, lastActivityAt]
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/InquiryStatus'
        title:
          type: string
          description: 최대 30자
        user:
          $ref: '#/components/schemas/InquiryUser'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/InquiryAssignee'
            - type: object
              nullable: true
              enum: [null]
        lastActivityAt:
          type: string
          format: date-time
          description: 마지막 메시지(사용자 문의·추가 문의·운영자 답변)의 작성 시각

    InquiryDetail:
      allOf:
        - $ref: '#/components/schemas/InquirySummary'
        - type: object
          required: [createdAt, messages]
          properties:
            createdAt:
              type: string
              format: date-time
            messages:
              type: array
              description: 시간순
              items:
                $ref: '#/components/schemas/InquiryMessage'

    InquirySummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InquirySummary'

    InquiryAdjacent:
      type: object
      required: [prevId, nextId]
      properties:
        prevId:
          type: integer
          nullable: true
        nextId:
          type: integer
          nullable: true

    AssignInquiryRequest:
      type: object
      required: [expectedAssigneeId]
      properties:
        expectedAssigneeId:
          type: integer
          nullable: true
          description: 화면에서 본 담당자의 팀원 ID입니다. 담당자가 없었다면 `null`입니다.

    ReplyInquiryRequest:
      type: object
