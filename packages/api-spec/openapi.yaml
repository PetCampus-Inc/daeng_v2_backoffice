      example:
        code: INQUIRY_NOT_FOUND
        message: 문의를 찾을 수 없습니다.

    NoticeContentError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, NOTICE_CONTENT_REQUIRED]
            details:
              type: array
              description: '`VALIDATION_FAILED`일 때만 채웁니다.'
              items:
                $ref: '#/components/schemas/ValidationErrorDetail'
      example:
        code: VALIDATION_FAILED
        message: 입력값이 올바르지 않습니다.
        details:
          - field: title
            reason: 제목은 50자 이하여야 합니다.

    NoticeContentRequiredError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [NOTICE_CONTENT_REQUIRED]
      example:
        code: NOTICE_CONTENT_REQUIRED
        message: 제목과 본문을 입력해 주세요.

    NoticeNotDraftError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [NOTICE_NOT_DRAFT]
      example:
        code: NOTICE_NOT_DRAFT
        message: 초안만 삭제할 수 있습니다.

    NoticeNotPublishedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [NOTICE_NOT_PUBLISHED]
      example:
        code: NOTICE_NOT_PUBLISHED
        message: 게시 중인 공지가 아닙니다.

    NoticePublishConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [NOTICE_ALREADY_PUBLISHED, NOTICE_VERSION_CONFLICT]
      example:
        code: NOTICE_ALREADY_PUBLISHED
        message: 이미 게시된 공지입니다.

    NoticeNotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [NOTICE_NOT_FOUND]
      example:
        code: NOTICE_NOT_FOUND
        message: 공지를 찾을 수 없습니다.

    NoticeVersionConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [NOTICE_VERSION_CONFLICT]
      example:
        code: NOTICE_VERSION_CONFLICT
        message: 다른 사람이 먼저 저장했습니다. 최신 내용을 불러와 주세요.

    NoticeImageInvalidError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [NOTICE_IMAGE_INVALID]
      example:
        code: NOTICE_IMAGE_INVALID
        message: 이미지 형식, 용량 또는 개수가 올바르지 않습니다.

    TermsVersionNotDraftError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [TERMS_VERSION_NOT_DRAFT]
      example:
        code: TERMS_VERSION_NOT_DRAFT
        message: 초안이 아닌 버전은 수정하거나 삭제할 수 없습니다.

    TermsEffectiveDateError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                [
                  TERMS_EFFECTIVE_DATE_TOO_SOON,
                  TERMS_EFFECTIVE_DATE_IN_PAST,
                  TERMS_EFFECTIVE_DATE_NOT_AFTER_LATEST,
                  TERMS_EFFECTIVE_DATE_INVALID_FORMAT,
                ]
      example:
        code: TERMS_EFFECTIVE_DATE_TOO_SOON
        message: 시행일은 공개일로부터 7일 이후여야 합니다.

    TermsVersionNotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [TERMS_VERSION_NOT_FOUND]
      example:
        code: TERMS_VERSION_NOT_FOUND
        message: 약관 버전을 찾을 수 없습니다.

    TermsVersionConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [TERMS_VERSION_CONFLICT, TERMS_VERSION_NOT_DRAFT]
      example:
        code: TERMS_VERSION_CONFLICT
        message: 다른 사람이 먼저 저장했습니다. 최신 내용을 불러와 주세요.

    TermsWithdrawNotAllowedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [TERMS_WITHDRAW_NOT_ALLOWED]
      example:
        code: TERMS_WITHDRAW_NOT_ALLOWED
        message: 시행 전 예정 버전만 철회할 수 있습니다.

    NotificationNotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [NOTIFICATION_NOT_FOUND]
      example:
        code: NOTIFICATION_NOT_FOUND
        message: 알림을 찾을 수 없습니다.

    ChangeLogTargetType:
      type: string
      description: 변경 이력의 대상 종류. `INQUIRY` 문의, `NOTICE` 공지, `TERMS_VERSION` 약관 버전, `ACCOUNT` 팀원 계정
      enum: [INQUIRY, NOTICE, TERMS_VERSION, ACCOUNT]

    ChangeLogAction:
      type: string
      description:
        기록하는 쓰기 행동입니다. 초안 수정·삭제, 표시명·직무 변경, 로그인·로그아웃, 조회는 기록하지 않습니다.
        `INQUIRY_ASSIGNED` 문의 맡기, `INQUIRY_ASSIGNEE_CHANGED` 담당자 변경, `INQUIRY_ASSIGNEE_RELEASED` 담당 해제,
        `INQUIRY_REPLIED` 답변 저장, `NOTICE_CREATED` 공지 작성(첫 게시 시점), `NOTICE_EDITED` 게시된 공지 수정,
        `NOTICE_UNPUBLISHED` 게시 해제, `NOTICE_REPUBLISHED` 재게시, `TERMS_VERSION_CREATED` 새 버전 등록,
        `TERMS_VERSION_PUBLISHED` 공개, `TERMS_VERSION_WITHDRAWN` 공개 철회, `ACCOUNT_REGISTERED` 등록,
        `ACCOUNT_ROLE_CHANGED` 역할 변경, `ACCOUNT_DEACTIVATED` 비활성화, `ACCOUNT_REGISTRATION_CANCELLED` 등록 취소,
        `ACCOUNT_REACTIVATED` 재활성화
      enum:
        - INQUIRY_ASSIGNED
        - INQUIRY_ASSIGNEE_CHANGED
        - INQUIRY_ASSIGNEE_RELEASED
        - INQUIRY_REPLIED
        - NOTICE_CREATED
        - NOTICE_EDITED
        - NOTICE_UNPUBLISHED
        - NOTICE_REPUBLISHED
        - TERMS_VERSION_CREATED
        - TERMS_VERSION_PUBLISHED
        - TERMS_VERSION_WITHDRAWN
        - ACCOUNT_REGISTERED
        - ACCOUNT_ROLE_CHANGED
        - ACCOUNT_DEACTIVATED
        - ACCOUNT_REGISTRATION_CANCELLED
        - ACCOUNT_REACTIVATED

    ChangeLogActor:
      type: object
      description: 행위자입니다. 표시명·직무는 기록 당시 값입니다.
      required: [id, displayName, jobRole, email]
      properties:
        id:
          type: integer
        displayName:
          type: string
        jobRole:
          $ref: '#/components/schemas/JobRole'
        email:
          type: string
          format: email
          example: petcampus.knockdog@gmail.com

    ChangeLogTarget:
      type: object
      description: 변경 대상입니다. `label`에는 기록 당시의 문의·공지 제목, 약관 종류와 버전, 계정 이메일이 들어갑니다.
      required: [id, label]
      properties:
        id:
          type: integer
          description: 문의 ID, 공지 ID, 약관 버전 ID, 팀원 ID
        label:
          type: string

    ChangeLogChange:
      type: object
      description: 변경 전→후 값입니다. 역할 변경과 담당자 변경일 때만 채워집니다.
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true

    ChangeLog:
      type: object
      required: [id, occurredAt, actor, targetType, target, action, change]
      properties:
        id:
          type: integer
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/ChangeLogActor'
        targetType:
          $ref: '#/components/schemas/ChangeLogTargetType'
        target:
          $ref: '#/components/schemas/ChangeLogTarget'
        action:
          $ref: '#/components/schemas/ChangeLogAction'
        change:
          oneOf:
            - $ref: '#/components/schemas/ChangeLogChange'
            - type: object
              nullable: true
              enum: [null]

    ChangeLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChangeLog'

    NoticeStatus:
      type: string
      description: 공지 게시 상태. `DRAFT` 초안, `PUBLISHED` 게시, `UNPUBLISHED` 게시 해제
      enum: [DRAFT, PUBLISHED, UNPUBLISHED]

    NoticeSummary:
      type: object
      description: 공지 목록의 한 행
      required: [id, title, status, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
          description: 초안은 빈 문자열일 수 있습니다.
        status:
          $ref: '#/components/schemas/NoticeStatus'
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: 최초 게시 일시입니다. 게시 전에는 `null`이고, 수정·재게시해도 바뀌지 않습니다.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notice:
      allOf:
        - $ref: '#/components/schemas/NoticeSummary'
        - type: object
          required: [body, version]
          properties:
            body:
              type: string
              description: 마크다운 본문입니다. 게시하려면 1~5,000자여야 하고, 초안은 비어 있어도 됩니다.
            version:
              type: integer
              description: 동시 수정을 막기 위한 값입니다. 수정·게시 요청에 그대로 보냅니다.

    NoticePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NoticeSummary'

    CreateNoticeRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 50
        body:
          type: string
          maxLength: 5000

    UpdateNoticeRequest:
      type: object
      required: [version]
      properties:
        title:
          type: string
          maxLength: 50
        body:
          type: string
          maxLength: 5000
        version:
          type: integer
          minimum: 0
          description: 화면을 열 때 받은 `version`

    NoticeVersionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
          description: 화면을 열 때 받은 `version`

    NoticeImageFile:
      type: object
      required: [fileName, contentType, size]
      properties:
        fileName:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png]
        size:
          type: integer
          minimum: 1
          maximum: 20971520
          description: 바이트 단위. 파일당 20MB 이하

    NoticeImageUploadRequest:
      type: object
      required: [files]
      properties:
        noticeId:
          type: integer
          description: 이미 저장된 공지에 이미지를 추가할 때만 보냅니다. 처음 저장하기 전에는 생략합니다.
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/NoticeImageFile'

    NoticeImageUploadUrl:
      type: object
      required: [uploadUrl, imageUrl]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: 파일을 직접 올릴 주소(유효시간이 짧습니다)
        imageUrl:
          type: string
          format: uri
          description: 업로드가 끝난 뒤 이미지를 불러올 최종 주소입니다. 마크다운 본문에 이 주소를 넣습니다.

    TermsKind:
      type: string
      description:
        약관 종류. `SERVICE_TERMS` 서비스 이용약관, `PRIVACY_POLICY` 개인정보 처리방침, `LOCATION_TERMS` 위치기반서비스
        이용약관
      enum: [SERVICE_TERMS, PRIVACY_POLICY, LOCATION_TERMS]

    TermsPublishStatus:
      type: string
      description: 공개 상태. `DRAFT` 초안, `PUBLISHED` 공개, `WITHDRAWN` 철회
      enum: [DRAFT, PUBLISHED, WITHDRAWN]

    TermsEffectiveStatus:
      type: string
      description: 시행 상태(공개된 버전만). `CURRENT` 현행, `SCHEDULED` 예정, `PAST` 과거
      enum: [CURRENT, SCHEDULED, PAST]

    TermsVersionSummary:
      type: object
      required: [id, kind, effectiveDate, publishStatus, effectiveStatus, publishedAt, updatedAt]
      properties:
        id:
          type: integer
          description: 약관 버전 ID입니다. 화면의 버전 번호로 씁니다.
        kind:
          $ref: '#/components/schemas/TermsKind'
        effectiveDate:
          type: string
          format: date
          description: 시행일(KST 날짜)
        publishStatus:
          $ref: '#/components/schemas/TermsPublishStatus'
        effectiveStatus:
          type: object
          allOf:
            - $ref: '#/components/schemas/TermsEffectiveStatus'
          nullable: true
          description: 공개 상태가 아니면 `null`
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: 공개한 시각. 초안은 `null`
        updatedAt:
          type: string
          format: date-time

    TermsVersion:
      allOf:
        - $ref: '#/components/schemas/TermsVersionSummary'
        - type: object
          required: [content, announcedDate, version]
          properties:
            content:
              type: string
              description: 마크다운입니다. 제목 없이 약관 본문으로 시작하고, 맨 아래에 공고일자·시행일자가 들어갑니다.
            announcedDate:
              type: string
              format: date
              nullable: true
              description: 공고일(공개한 날짜, KST). 공개 전에는 `null`
            version:
              type: integer
              description: 동시 수정을 막기 위한 값입니다. 수정·공개 요청에 그대로 보냅니다.

    TermsKindSummary:
      type: object
      required: [kind, currentVersion, scheduledVersion]
      properties:
        kind:
          $ref: '#/components/schemas/TermsKind'
        currentVersion:
          type: object
          allOf:
            - $ref: '#/components/schemas/TermsVersionSummary'
          nullable: true
          description: 현행 버전. 없으면 `null`
        scheduledVersion:
          type: object
          allOf:
            - $ref: '#/components/schemas/TermsVersionSummary'
          nullable: true
          description: 가장 가까운 예정 버전. 없으면 `null`

    CreateTermsVersionRequest:
      type: object
      required: [effectiveDate, content]
      properties:
        effectiveDate:
          type: string
          format: date
        content:
          type: string
          description:
            마크다운입니다. 공고일·시행일 자리에 `{{공고일}}`·`{{시행일}}`을 적어 두면 공개할 때 자동으로 채워집니다.

    UpdateTermsVersionRequest:
      type: object
      required: [version]
      properties:
        effectiveDate:
          type: string
          format: date
        content:
          type: string
        version:
          type: integer
          minimum: 0
          description: 화면을 열 때 받은 `version`

    TermsVersionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
          description: 화면을 열 때 받은 `version`

    TermsDraftTemplate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          nullable: true
          description: 시작 본문. 공개한 버전이 없으면 `null`

    NotificationKind:
      type: string
      description:
        알림 종류. `NEW_INQUIRY` 새 문의, `ADDITIONAL_INQUIRY` 추가 문의, `ASSIGNEE_CHANGED` 담당자 변경, `NEW_IDEA` 새
        제안
      enum: [NEW_INQUIRY, ADDITIONAL_INQUIRY, ASSIGNEE_CHANGED, NEW_IDEA]

    NotificationTargetType:
      type: string
      description: 알림 대상 종류. `INQUIRY` 문의, `IDEA` 아이디어 제안
      enum: [INQUIRY, IDEA]

    Notification:
      type: object
      required: [id, kind, message, targetType, targetId, createdAt, readAt]
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/NotificationKind'
        message:
          type: string
