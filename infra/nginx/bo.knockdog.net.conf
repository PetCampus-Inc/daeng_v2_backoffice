# bo.knockdog.net 리버스 프록시 (EC2 호스트 nginx → 로컬 3000의 BO 서버)
# CloudFront의 /api/* 요청이 이 주소로 들어온다. 브라우저는 이 주소를 직접 쓰지 않는다. (ADR 0018)
#
# 이 파일이 원본이다. 서버에서 직접 고치지 않고 이 파일을 고친 뒤 아래 순서로 반영한다.
#   서버 설치 경로: /etc/nginx/conf.d/bo.knockdog.net.conf
#   반영: sudo nginx -t && sudo systemctl reload nginx
#
# DNS: Route 53에 bo.knockdog.net A 레코드(api.knockdog.net과 같은 EC2 IP)
# 인증서: v1과 같이 acme.sh(webroot, ECC)로 ec2-user가 발급·갱신하고 갱신 뒤 nginx를 reload 한다.
#   최초 발급: ~/.acme.sh/acme.sh --issue -d bo.knockdog.net -w /var/www/html --keylength ec-256 --reloadcmd "sudo systemctl reload nginx"
#   인증서를 받으려면 80 포트 서버 블록이 먼저 있어야 하고, /var/www/html은 ec2-user가 쓸 수 있고 nginx가 읽을 수 있어야 한다.

server {
    listen 80;
    server_name bo.knockdog.net;

    # 인증서 갱신용 HTTP-01 검증
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bo.knockdog.net;

    ssl_certificate     /home/ec2-user/.acme.sh/bo.knockdog.net_ecc/fullchain.cer;
    ssl_certificate_key /home/ec2-user/.acme.sh/bo.knockdog.net_ecc/bo.knockdog.net.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
