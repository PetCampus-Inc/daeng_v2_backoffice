name: Deploy Frontend Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-production:
    # 배포 본문은 deploy-frontend-reusable.yml과 개발 배포가 함께 쓴다. job에 environment를 쓰지 않는다.
    uses: ./.github/workflows/deploy-frontend-reusable.yml
    with:
      environment-name: Production
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-deploy-role-arn: ${{ vars.PRODUCTION_AWS_DEPLOY_ROLE_ARN }}
      s3-bucket: ${{ vars.PRODUCTION_S3_BUCKET }}
      cloudfront-distribution-id: ${{ vars.PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID }}
      site-url: ${{ vars.PRODUCTION_URL }}
      google-client-id: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      api-base-url: ${{ vars.PRODUCTION_VITE_API_BASE_URL }}
      require-sentry: true
      sentry-org: ${{ vars.SENTRY_ORG }}
      sentry-project: ${{ vars.SENTRY_PROJECT }}
      sentry-dsn: ${{ vars.VITE_SENTRY_DSN }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
