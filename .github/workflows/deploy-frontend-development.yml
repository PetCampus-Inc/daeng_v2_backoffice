name: Deploy Frontend Development

# dev 브랜치에 push(머지)되면 개발(베타) 웹을 배포한다. AWS 역할은 dev 브랜치 push에서만 열리므로
# workflow_dispatch는 넣지 않는다.
on:
  push:
    branches: [dev]

concurrency:
  group: development-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # 개발용 GitHub 변수가 아직 등록되지 않았으면 실패하지 않고 건너뛴다.
  skip-development:
    name: Skip (development variables not configured)
    if: ${{ vars.DEVELOPMENT_S3_BUCKET == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain skip
        run: |
          echo "::notice::DEVELOPMENT_S3_BUCKET is not set, so the development deployment was skipped. Register the DEVELOPMENT_* GitHub Actions variables to enable it."

  deploy-development:
    # 배포 본문은 deploy-frontend-reusable.yml과 운영 배포가 함께 쓴다. job에 environment를 쓰지 않는다.
    # Sentry 값과 토큰은 넘기지 않는다. 그러면 소스맵 업로드와 Sentry가 모두 꺼져 운영 Sentry가 오염되지 않는다.
    # API 주소는 DEVELOPMENT_VITE_API_BASE_URL 변수로 넣는다(예 https://dev-bo.knockdog.net/api/v0/admin). 비우면 같은 주소의 /api를 쓴다.
    if: ${{ vars.DEVELOPMENT_S3_BUCKET != '' }}
    uses: ./.github/workflows/deploy-frontend-reusable.yml
    with:
      environment-name: Development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-deploy-role-arn: ${{ vars.DEVELOPMENT_AWS_DEPLOY_ROLE_ARN }}
      s3-bucket: ${{ vars.DEVELOPMENT_S3_BUCKET }}
      cloudfront-distribution-id: ${{ vars.DEVELOPMENT_CLOUDFRONT_DISTRIBUTION_ID }}
      site-url: ${{ vars.DEVELOPMENT_URL }}
      google-client-id: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      api-base-url: ${{ vars.DEVELOPMENT_VITE_API_BASE_URL }}
