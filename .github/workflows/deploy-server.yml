name: Deploy Server

on:
  workflow_dispatch:

# 배포가 겹치면 서버에서 컨테이너 교체가 충돌하므로 순서대로 하나씩 실행
concurrency:
  group: deploy-server
  cancel-in-progress: false

# AWS 인증은 장기 액세스 키 대신 GitHub OIDC로 IAM 역할을 받아 사용
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  DEPLOY_ROLE_ARN: arn:aws:iam::147525197222:role/knockdog-backoffice-production-deploy
  DEPLOY_BUCKET: knockdog-147525197222-deploy-staging
  INSTANCE_ID: i-089ed680dd40bcebe
  ECR_REPOSITORY: 147525197222.dkr.ecr.ap-northeast-2.amazonaws.com/knockdog-backoffice-server
  DOCKER_NETWORK: ec2-user_default
  HOST_PORT: '3000'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build images
        run: |
          docker build -f apps/server/Dockerfile --target runtime -t "${ECR_REPOSITORY}:${GITHUB_SHA}" .
          docker build -f apps/server/Dockerfile --target migrate -t "${ECR_REPOSITORY}:${GITHUB_SHA}-migrate" .

      - name: Push images
        run: |
          docker push "${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${ECR_REPOSITORY}:${GITHUB_SHA}-migrate"

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Infisical prod 값으로 .env를 만든다. 값은 로그에 출력하지 않는다.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          export-type: file

      - name: Normalize and validate .env
        run: node apps/server/deploy/prepare-env.mjs

      # 서버에 .env와 배포 스크립트를 보내 실행한다. (SSH 포트와 키 불필요)
      - name: Deploy to EC2 via SSM
        run: bash apps/server/deploy/trigger-deploy.sh
